body:
- type: markdown
  attributes:
    value: |
      Thanks for playing SUBOCEANIC!

      This is Phase 1 of the project and my first complete game built from start to finish. There's still plenty I want to expand, refine, and improve.

      I'd love to hear what you thought.

- type: textarea
  id: feedback
  attributes:
    label: How was your dive?
    description: What did you like? What could be better? Find a bug? Have an idea? Let me know.
    placeholder: Share anything you'd like...
  validations:
    required: true